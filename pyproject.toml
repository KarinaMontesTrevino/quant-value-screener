[project]
name = "quant-value-screener"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "finvizfinance>=1.6.1",
    "google-genai>=3.3.0",
    "gs-quant>=2.2.5",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "yfinance>=1.8.0",
]

[project.scripts]
quant-value-screener = "quant_value_screener:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
